[build-system]
requires = ["hatchling>=1.33,<1.34"]
build-backend = "hatchling.build"

[project]
name = "getting-started-with-aws-strands"
version = "0.2.0"
description = "A practical Strands Agents course built around synthetic Nimbus Travel data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "strands-agents[ollama]>=1.62,<1.63",
  "strands-agents-tools>=0.8.10,<0.9",
  "boto3>=1.43.121,<1.44",
  "mcp>=2.1.1,<2.2",
  "ollama>=0.6.3,<0.7",
  "pydantic>=2.14.1,<2.15",
  "python-dotenv>=1.2.4,<1.3",
  "rich>=15,<16",
  "pillow>=12.3,<13",
  "httpx>=0.28.1,<0.29",
]

[dependency-groups]
foundations = [{include-group = "dev"}]
dev = [
  "pytest>=9.2,<9.3", "pytest-asyncio>=1.4.1,<1.5",
  "pytest-socket>=0.8.1,<0.9", "moto[s3,dynamodb]>=5.2.5,<5.3",
  "ruff>=0.17.3,<0.18", "pre-commit>=4.7,<4.8",
  "nbstripout>=0.9.1,<0.10", "pypdf>=6.21.4,<6.22",
  "reportlab>=5.1,<5.2", "pyyaml>=6.0.3,<6.1",
]
providers = [
  "strands-agents[anthropic,openai,litellm]>=1.62,<1.63",
  "anthropic>=0.125,<0.126", "openai>=2.54,<2.55",
  "litellm>=1.106.6,<1.107",
]
rag = ["chromadb>=1.5.9,<1.6", "pypdf>=6.21.4,<6.22", "rank-bm25>=0.2.2,<0.3", "matplotlib>=3.11.2,<3.12"]
memory = ["mem0-strands>=0.1.1,<0.2", "mem0ai>=2.2.1,<2.3"]
multiagent = ["strands-agents[a2a]>=1.62,<1.63", "a2a-sdk>=0.3.26,<0.4"]
aws = ["bedrock-agentcore>=1.25.1,<1.26", "bedrock-agentcore-starter-toolkit>=0.3.14,<0.4", "aws-cdk-lib>=2.275,<2.276", "constructs>=10.8.1,<10.9"]
identity = ["PyJWT[crypto]>=2.15.1,<2.16", "websockets>=17.3,<18"]
deploy = ["strands-agents[ollama]>=1.62,<1.63", "bedrock-agentcore>=1.25.1,<1.26", "fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55", "python-dotenv>=1.2.4,<1.3", "rich>=15,<16"]
apps = ["fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55", "streamlit>=1.66.1,<1.67", "matplotlib>=3.11.2,<3.12"]
evals = ["strands-agents-evals>=1.7,<1.8"]
observability = ["strands-agents[otel]>=1.62,<1.63", "opentelemetry-sdk>=1.45.1,<1.46", "opentelemetry-exporter-otlp>=1.45.1,<1.46"]
notebooks = ["jupyter>=1.1.1,<1.2", "nbclient>=0.11,<0.12"]
partner = ["langgraph>=1.2.18,<1.3"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["common", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules", "checkpoints"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: explicit opt-in real model or AWS calls", "local_protocol: loopback protocol integration"]
filterwarnings = [
  "error::DeprecationWarning:strands.*",
  "error::PendingDeprecationWarning:strands.*",
  "error:.*deprecat.*:UserWarning:strands.*",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".nimbus", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_data.py" = ["E501"]
"*.ipynb" = ["E402", "F811", "F401"] # Each cell mirrors an independently runnable script.
