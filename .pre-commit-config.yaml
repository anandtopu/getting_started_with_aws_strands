repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Python lint
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Python formatting
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: nbstripout
        name: Clear notebook outputs
        entry: uv run --frozen nbstripout
        language: system
        files: \.ipynb$
      - id: safety-contracts
        name: Check IAM and sample configuration
        entry: uv run --frozen pytest -q tests/test_repository_contract.py
        language: system
        pass_filenames: false
